<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Centers Explorer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --color-centroid: #f97316;    /* Orange */
            --color-orthocenter: #3b82f6; /* Blue */
            --color-circumcenter: #22c55e;/* Green */
            --color-incenter: #a855f7;    /* Purple */
            --color-triangle: #cbd5e1;    /* Light Gray */
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #dashboard {
            width: 380px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: -4px 0 15px rgba(0,0,0,0.3);
        }

        .section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: white;
        }

        /* Toggles */
        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.95rem;
            user-select: none;
        }

        .toggle-label input {
            display: none;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid;
            border-radius: 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .toggle-label input:checked + .custom-checkbox::after {
            content: '✔';
            font-size: 14px;
            color: inherit;
        }

        #chk-centroid + .custom-checkbox { border-color: var(--color-centroid); color: var(--color-centroid); }
        #chk-orthocenter + .custom-checkbox { border-color: var(--color-orthocenter); color: var(--color-orthocenter); }
        #chk-circumcenter + .custom-checkbox { border-color: var(--color-circumcenter); color: var(--color-circumcenter); }
        #chk-incenter + .custom-checkbox { border-color: var(--color-incenter); color: var(--color-incenter); }

        /* Presets */
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        button:hover {
            background-color: #334155;
            border-color: #475569;
        }

        /* Info Card */
        .info-card {
            background-color: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .info-card:last-child {
            margin-bottom: 0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stat-row span:last-child {
            color: var(--text-main);
            font-weight: 500;
        }

        #triangle-type {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        #insights-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #fca5a5;
        }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="geometryCanvas"></canvas>
    </div>

    <div id="dashboard">
        <div class="section">
            <h2>Display Controls</h2>
            <div class="toggle-group">
                <label class="toggle-label">
                    <input type="checkbox" id="chk-centroid" checked>
                    <div class="custom-checkbox"></div>
                    Centroid (G) & Medians
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="chk-orthocenter" checked>
                    <div class="custom-checkbox"></div>
                    Orthocentre (H) & Altitudes
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="chk-circumcenter" checked>
                    <div class="custom-checkbox"></div>
                    Circumcentre (O) & Circumcircle
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="chk-incenter" checked>
                    <div class="custom-checkbox"></div>
                    Incentre (I) & Incircle
                </label>
            </div>
        </div>

        <div class="section">
            <h2>Shape Presets</h2>
            <div class="preset-grid">
                <button onclick="setPreset('acute')">Acute</button>
                <button onclick="setPreset('right')">Right-angled</button>
                <button onclick="setPreset('obtuse')">Obtuse</button>
                <button onclick="setPreset('isosceles')">Isosceles</button>
                <button onclick="setPreset('equilateral')">Equilateral</button>
                <button onclick="setPreset('scalene')">Scalene</button>
            </div>
        </div>

        <div class="section" style="flex: 1;">
            <h2>Dynamic Insights</h2>
            <div class="info-card">
                <span id="triangle-type">Calculating...</span>
                <div id="insights-text">Drag the vertices to explore properties.</div>
            </div>
            
            <div class="info-card">
                <div class="stat-row"><span>Angle A:</span><span id="ang-A">0°</span></div>
                <div class="stat-row"><span>Angle B:</span><span id="ang-B">0°</span></div>
                <div class="stat-row"><span>Angle C:</span><span id="ang-C">0°</span></div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">
                <div class="stat-row"><span>Side a (BC):</span><span id="side-a">0.0</span></div>
                <div class="stat-row"><span>Side b (AC):</span><span id="side-b">0.0</span></div>
                <div class="stat-row"><span>Side c (AB):</span><span id="side-c">0.0</span></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('geometryCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Points
        let pts = [
            { x: 0, y: 0, targetX: 0, targetY: 0 }, // A
            { x: 0, y: 0, targetX: 0, targetY: 0 }, // B
            { x: 0, y: 0, targetX: 0, targetY: 0 }  // C
        ];

        let draggingPoint = null;
        let isAnimating = false;

        // UI Elements
        const chkCentroid = document.getElementById('chk-centroid');
        const chkOrthocenter = document.getElementById('chk-orthocenter');
        const chkCircumcenter = document.getElementById('chk-circumcenter');
        const chkIncenter = document.getElementById('chk-incenter');

        // Colors
        const colors = {
            triangle: '#cbd5e1',
            centroid: '#f97316',
            orthocenter: '#3b82f6',
            circumcenter: '#22c55e',
            incenter: '#a855f7'
        };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            width = rect.width;
            height = rect.height;
            if(!isAnimating && pts[0].x === 0) setPreset('scalene', false); // Initial state
        }
        window.addEventListener('resize', resizeCanvas);

        // Vector Math Helpers
        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
        const getAngle = (A, B, C) => { // Angle at B
            const a = dist(B, C), c = dist(A, B), b = dist(A, C);
            return Math.acos(Math.max(-1, Math.min(1, (a*a + c*c - b*b) / (2*a*c)))) * (180/Math.PI);
        };
        const lerp = (start, end, amt) => (1 - amt) * start + amt * end;

        // Geometric Center Calculations
        function getCentroid(A, B, C) {
            return { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 };
        }

        function getOrthocenter(A, B, C) {
            const m1x = A.x, m1y = A.y;
            const d1x = C.y - B.y, d1y = B.x - C.x; 

            const m2x = B.x, m2y = B.y;
            const d2x = A.y - C.y, d2y = C.x - A.x;

            const det = d1x * (-d2y) - (-d2x) * d1y;
            if (Math.abs(det) < 1e-6) return { x: 0, y: 0 }; 
            const dx = m2x - m1x, dy = m2y - m1y;
            const t1 = (dx * (-d2y) - (-d2x) * dy) / det;
            return { x: m1x + t1 * d1x, y: m1y + t1 * d1y };
        }

        function getAltitudeFoot(V, P1, P2) {
            const dx = P2.x - P1.x, dy = P2.y - P1.y;
            const mag2 = dx*dx + dy*dy;
            if (mag2 === 0) return {x: P1.x, y: P1.y};
            const t = ((V.x - P1.x)*dx + (V.y - P1.y)*dy) / mag2;
            return { x: P1.x + t*dx, y: P1.y + t*dy };
        }

        function getCircumcenter(A, B, C) {
            const D = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
            if (Math.abs(D) < 1e-6) return { x: 0, y: 0 };
            const A2 = A.x*A.x + A.y*A.y;
            const B2 = B.x*B.x + B.y*B.y;
            const C2 = C.x*C.x + C.y*C.y;
            const x = (A2 * (B.y - C.y) + B2 * (C.y - A.y) + C2 * (A.y - B.y)) / D;
            const y = (A2 * (C.x - B.x) + B2 * (A.x - C.x) + C2 * (B.x - A.x)) / D;
            return { x, y, R: dist({x, y}, A) };
        }

        function getIncenter(A, B, C) {
            const a = dist(B, C), b = dist(A, C), c = dist(A, B);
            const p = a + b + c;
            const x = (a*A.x + b*B.x + c*C.x) / p;
            const y = (a*A.y + b*B.y + c*C.y) / p;
            
            // Inradius: Area / semi-perimeter
            const s = p / 2;
            const area = Math.sqrt(s * (s - a) * (s - b) * (s - c));
            const r = area / s;

            // Accurate feet for angle bisectors using Angle Bisector Theorem
            const fA = { x: (b*B.x + c*C.x)/(b+c), y: (b*B.y + c*C.y)/(b+c) };
            const fB = { x: (a*A.x + c*C.x)/(a+c), y: (a*A.y + c*C.y)/(a+c) };
            const fC = { x: (a*A.x + b*B.x)/(a+b), y: (a*A.y + b*B.y)/(a+b) };

            return { x, y, r, fA, fB, fC };
        }

        // Drawing Functions
        function drawLine(p1, p2, color, dashed = false, lineWidth = 1.5) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            if (dashed) ctx.setLineDash([5, 5]);
            else ctx.setLineDash([]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPoint(p, label, color) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = varBg();
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(label, p.x + 10, p.y - 10);
        }

        function varBg() { return getComputedStyle(document.body).getPropertyValue('--bg-color'); }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const [A, B, C] = pts;

            // Draw Triangle
            ctx.beginPath();
            ctx.moveTo(A.x, A.y);
            ctx.lineTo(B.x, B.y);
            ctx.lineTo(C.x, C.y);
            ctx.closePath();
            ctx.strokeStyle = colors.triangle;
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(203, 213, 225, 0.05)';
            ctx.fill();
            ctx.stroke();

            // Centroid (G)
            if (chkCentroid.checked) {
                const Ma = { x: (B.x + C.x)/2, y: (B.y + C.y)/2 };
                const Mb = { x: (A.x + C.x)/2, y: (A.y + C.y)/2 };
                const Mc = { x: (A.x + B.x)/2, y: (A.y + B.y)/2 };
                drawLine(A, Ma, colors.centroid, true);
                drawLine(B, Mb, colors.centroid, true);
                drawLine(C, Mc, colors.centroid, true);
                drawPoint(getCentroid(A, B, C), 'G', colors.centroid);
            }

            // Orthocenter (H)
            if (chkOrthocenter.checked) {
                const H = getOrthocenter(A, B, C);
                const fa = getAltitudeFoot(A, B, C);
                const fb = getAltitudeFoot(B, A, C);
                const fc = getAltitudeFoot(C, A, B);

                // Draw solid to foot, dashed to H
                drawLine(A, fa, colors.orthocenter, false, 1);
                drawLine(fa, H, colors.orthocenter, true, 1);
                drawLine(B, fb, colors.orthocenter, false, 1);
                drawLine(fb, H, colors.orthocenter, true, 1);
                drawLine(C, fc, colors.orthocenter, false, 1);
                drawLine(fc, H, colors.orthocenter, true, 1);
                drawPoint(H, 'H', colors.orthocenter);
            }

            // Circumcenter (O)
            if (chkCircumcenter.checked) {
                const O = getCircumcenter(A, B, C);
                
                const Ma = { x: (B.x + C.x)/2, y: (B.y + C.y)/2 };
                const Mb = { x: (A.x + C.x)/2, y: (A.y + C.y)/2 };
                const Mc = { x: (A.x + B.x)/2, y: (A.y + B.y)/2 };
                
                drawLine(Ma, O, colors.circumcenter, true);
                drawLine(Mb, O, colors.circumcenter, true);
                drawLine(Mc, O, colors.circumcenter, true);

                ctx.beginPath();
                ctx.arc(O.x, O.y, O.R, 0, Math.PI * 2);
                ctx.strokeStyle = colors.circumcenter;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                drawPoint(O, 'O', colors.circumcenter);
            }

            // Incenter (I)
            if (chkIncenter.checked) {
                const inc = getIncenter(A, B, C);
                // Angle bisectors perfectly landing on opposite sides
                drawLine(A, inc.fA, colors.incenter, true);
                drawLine(B, inc.fB, colors.incenter, true);
                drawLine(C, inc.fC, colors.incenter, true);

                // Incircle
                ctx.beginPath();
                ctx.arc(inc.x, inc.y, inc.r, 0, Math.PI * 2);
                ctx.strokeStyle = colors.incenter;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);

                drawPoint(inc, 'I', colors.incenter);
            }

            // Draw Vertices
            drawPoint(A, 'A', 'white');
            drawPoint(B, 'B', 'white');
            drawPoint(C, 'C', 'white');

            updateDashboard();
        }

        function updateDashboard() {
            const [A, B, C] = pts;
            const a = dist(B, C), b = dist(A, C), c = dist(A, B);
            
            const angA = getAngle(C, A, B);
            const angB = getAngle(A, B, C);
            const angC = getAngle(B, C, A);

            document.getElementById('side-a').innerText = a.toFixed(1);
            document.getElementById('side-b').innerText = b.toFixed(1);
            document.getElementById('side-c').innerText = c.toFixed(1);

            document.getElementById('ang-A').innerText = angA.toFixed(1) + '°';
            document.getElementById('ang-B').innerText = angB.toFixed(1) + '°';
            document.getElementById('ang-C').innerText = angC.toFixed(1) + '°';

            // Type classification
            const maxAng = Math.max(angA, angB, angC);
            let typeAng = 'Acute';
            if (Math.abs(maxAng - 90) < 1.5) typeAng = 'Right-angled';
            else if (maxAng > 90) typeAng = 'Obtuse';

            let typeSide = 'Scalene';
            const tol = 3.0; // px tolerance for sides
            if (Math.abs(a-b)<tol && Math.abs(b-c)<tol) typeSide = 'Equilateral';
            else if (Math.abs(a-b)<tol || Math.abs(b-c)<tol || Math.abs(a-c)<tol) typeSide = 'Isosceles';

            let insight = "";
            if (typeAng === 'Obtuse') insight = "Orthocentre (H) and Circumcentre (O) fall outside the triangle.";
            else if (typeAng === 'Right-angled') insight = "Orthocentre (H) lies exactly on the right angle vertex. Circumcentre (O) is the midpoint of the hypotenuse.";
            else if (typeSide === 'Equilateral') insight = "All four centers (G, H, O, I) perfectly coincide at the same point!";
            else insight = "Euler Line: Orthocentre (H), Centroid (G), and Circumcentre (O) are collinear.";

            document.getElementById('triangle-type').innerText = `${typeAng} + ${typeSide}`;
            document.getElementById('insights-text').innerText = insight;
        }

        // Presets & Animation
        function setPreset(type, animate = true) {
            const cx = width / 2;
            const cy = height / 2;
            
            let t = [];
            switch(type) {
                case 'acute': t = [{x: cx, y: cy-150}, {x: cx-200, y: cy+150}, {x: cx+200, y: cy+150}]; break;
                case 'right': t = [{x: cx-200, y: cy-150}, {x: cx-200, y: cy+150}, {x: cx+200, y: cy+150}]; break;
                case 'obtuse': t = [{x: cx-250, y: cy+150}, {x: cx+50, y: cy-100}, {x: cx+250, y: cy+150}]; break;
                case 'isosceles': t = [{x: cx, y: cy-150}, {x: cx-150, y: cy+150}, {x: cx+150, y: cy+150}]; break;
                case 'equilateral': 
                    const h = 400 * Math.sqrt(3)/2; 
                    t = [{x: cx, y: cy+150-h}, {x: cx-200, y: cy+150}, {x: cx+200, y: cy+150}]; 
                    break;
                case 'scalene': t = [{x: cx-100, y: cy-150}, {x: cx-200, y: cy+150}, {x: cx+250, y: cy+50}]; break;
            }

            pts.forEach((p, i) => {
                p.targetX = t[i].x;
                p.targetY = t[i].y;
                if (!animate) { p.x = p.targetX; p.y = p.targetY; }
            });

            if (animate && !isAnimating) {
                isAnimating = true;
                requestAnimationFrame(animateFrame);
            } else if (!animate) {
                draw();
            }
        }

        function animateFrame() {
            let done = true;
            pts.forEach(p => {
                p.x = lerp(p.x, p.targetX, 0.1);
                p.y = lerp(p.y, p.targetY, 0.1);
                if (Math.abs(p.x - p.targetX) > 0.5 || Math.abs(p.y - p.targetY) > 0.5) done = false;
            });
            draw();
            if (!done) requestAnimationFrame(animateFrame);
            else isAnimating = false;
        }

        // Interaction
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            draggingPoint = pts.find(p => dist(p, pos) < 20);
        });

        window.addEventListener('mousemove', (e) => {
            if (draggingPoint) {
                const pos = getMousePos(e);
                draggingPoint.x = draggingPoint.targetX = pos.x;
                draggingPoint.y = draggingPoint.targetY = pos.y;
                if (!isAnimating) draw();
            }
        });

        window.addEventListener('mouseup', () => { draggingPoint = null; });
        
        // Touch Support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            draggingPoint = pts.find(p => dist(p, pos) < 30);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if (draggingPoint) {
                const rect = canvas.getBoundingClientRect();
                draggingPoint.x = draggingPoint.targetX = e.touches[0].clientX - rect.left;
                draggingPoint.y = draggingPoint.targetY = e.touches[0].clientY - rect.top;
                if (!isAnimating) draw();
            }
        }, {passive: false});

        window.addEventListener('touchend', () => { draggingPoint = null; });

        // Event listeners for checkboxes
        document.querySelectorAll('input[type=checkbox]').forEach(chk => {
            chk.addEventListener('change', () => { if(!isAnimating) draw(); });
        });

        // Init
        setTimeout(() => {
            resizeCanvas();
        }, 100);

    </script>
</body>
</html>
